version: 2
updates:
  # Proposes the upgrade when a new major version (e.g. @v2) is released
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: weekly
