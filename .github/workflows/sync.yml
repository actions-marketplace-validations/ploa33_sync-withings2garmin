# ─────────────────────────────────────────────────────────────────────────────
#  Withings → Garmin Connect Sync
#  This is the ONLY file your repository needs.
# ─────────────────────────────────────────────────────────────────────────────
name: "Withings → Garmin Sync"

on:
  repository_dispatch:
    types: [withings_sync]
  schedule:
    - cron: "0 7,20 * * *"   # 09:00 & 22:00 CEST safety net
  workflow_dispatch:
    inputs:
      mode:
        description: "sync (normal) · dry-run (test fetch) · simulate (upload test weigh-in)"
        type: choice
        options: [sync, dry-run, simulate]
        default: sync
      garmin_mfa_code:
        description: "[2FA only] Garmin 6-digit code (only needed once if 2FA is enabled)"
        required: false
        default: ""
      withings_code:
        description: "[Auto-filled] Withings authorization code (leave empty)"
        required: false
        default: ""

permissions:
  contents: write   # saves rotating tokens & session to 'withings2garmin-state' branch
  id-token: write   # authenticates with the stateless relay via GitHub OIDC

concurrency:
  group: withings2garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'ploa33/sync-withings2garmin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ploa33/sync-withings2garmin@v1
        with:
          withings-client-id: ${{ vars.WITHINGS_CLIENT_ID || secrets.WITHINGS_CLIENT_ID }}
          withings-client-secret: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          withings-refresh-token: ${{ secrets.WITHINGS_REFRESH_TOKEN }}
          withings-code: ${{ inputs.withings_code || github.event.client_payload.code }}
          garmin-email: ${{ secrets.GARMIN_EMAIL }}
          garmin-password: ${{ secrets.GARMIN_PASSWORD }}
          garmin-mfa-code: ${{ inputs.garmin_mfa_code }}
          webhook-url: ${{ vars.WEBHOOK_URL || secrets.WEBHOOK_URL }}
          mode: ${{ inputs.mode || 'sync' }}
